name: Deploy to EC2

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/html-signin-app:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/html-signin-app:latest


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/html-signin-app:latest
            docker stop html-signin-app || true
            docker rm   html-signin-app || true
            docker run -d \
              --name html-signin-app \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/html-signin-app:latest
            echo "Done! App is live!"


  create-pr:
    name: Create PR staging -> main
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists. It updates automatically with the new push."
            exit 0
          fi

          gh pr create \
            --base main \
            --head staging \
            --title "Auto PR: staging -> main" \
            --body "Automatically created after a successful deploy of commit ${{ github.sha }} to staging."
