name: Create PR staging to main

on:
  push:
    branches:
      - staging

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists. It updates automatically with the new push."
            exit 0
          fi

          gh pr create \
            --base main \
            --head staging \
            --title "Auto PR: staging -> main" \
            --body "Automatically created from push to staging (commit ${{ github.sha }})."
